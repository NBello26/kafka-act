services:
  consumidor: 
    build:  
      context: ./consumidor
    container_name: consumidor
    ports:  
      - "8081:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
  productor: 
    build: 
      context: ./productor
    container_name: productor
    ports: 
      - "8082:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
volumes: 
  kafka_data: